name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust release solver
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            preflop-solver/target/release
          key: ${{ runner.os }}-rust-release-${{ hashFiles('preflop-solver/Cargo.lock', 'preflop-solver/Cargo.toml', 'preflop-solver/src/**/*.rs', 'preflop-solver/tests/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-

      - name: Test Rust release solver
        run: cargo test --release --manifest-path preflop-solver/Cargo.toml

      - name: Test practice release tools
        run: npm run test:practice-tools

      - name: Test TypeScript application
        run: npm test

      - name: Build production application and solver
        run: npm run build

      - name: Verify pinned production resolver bundle
        run: npm run practice:verify-resolver-build

      - name: Exercise real resolver on every street
        run: PRACTICE_RESOLVER_THREADS=1 npm run test:practice-resolver-integration
