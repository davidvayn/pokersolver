[package]
name = "preflop-solver"
version = "0.3.0"
edition = "2021"
description = "Offline validation and heads-up push/fold solver for Poker Lab"
license = "MIT"

[dependencies]
flate2 = "1"
matrixmultiply = "0.3"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
