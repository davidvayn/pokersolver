[package]
name = "preflop-solver"
version = "0.1.0"
edition = "2021"
description = "Offline validation and heads-up push/fold solver for Poker Lab"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
